# Isolated high-volume testing profile. Activate explicitly with loadtest.
spring.datasource.url=${LOADTEST_DATASOURCE_URL}
spring.datasource.username=${LOADTEST_DB_USER}
spring.datasource.password=${LOADTEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

jwt.secret=${LOADTEST_JWT_SECRET}

app.seed.admin=false
app.seed.sample-data=false
app.seed.workflow-fixtures=false
app.seed.mobile-pins=false

# Synthetic data is opt-in and is rejected unless this profile targets tnl_loadtest.
app.loadtest.expected-database=tnl_loadtest
app.loadtest.seed.enabled=${LOADTEST_SEED_ENABLED:false}
app.loadtest.seed.shipments=${LOADTEST_SEED_SHIPMENTS:10000}
app.loadtest.seed.random-seed=${LOADTEST_SEED_RANDOM_SEED:20260925}
app.loadtest.seed.batch-size=${LOADTEST_SEED_BATCH_SIZE:250}
app.loadtest.seed.password=${LOADTEST_SEED_PASSWORD:}

server.port=8080

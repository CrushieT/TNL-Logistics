# Isolated workflow-testing database. This profile does not read MYSQL_DATABASE from .env.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/tnl_workflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}

app.seed.admin=true
app.seed.sample-data=true
app.seed.workflow-fixtures=true
app.seed.mobile-pins=true

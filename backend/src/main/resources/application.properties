spring.application.name=logistics
spring.profiles.default=dev

spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET}

# JWT Expiration Configuration (Differentiated Lifecycles: Web Admin shift TTL vs Mobile Staff TTL)
jwt.expiration.admin-hours=${JWT_EXPIRATION_ADMIN_HOURS:12}
jwt.expiration.staff-days=${JWT_EXPIRATION_STAFF_DAYS:10}

logging.level.root=INFO
logging.level.com.tnl.logistics=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Data initialization configuration (disabled by default in production packaging)
app.seed.admin=${APP_SEED_ADMIN:false}
app.seed.sample-data=${APP_SEED_SAMPLE_DATA:false}
app.seed.mobile-pins=${APP_SEED_MOBILE_PINS:false}

# Global CORS allowed origins configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

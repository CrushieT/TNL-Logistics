# Import the root-level .env file (using [.properties] to parse it as standard properties key-value format)
spring.config.import=optional:file:../.env[.properties]

# Dedicated isolated test database schema
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/tnl_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Test-only signing key. This profile must never be enabled in a deployed environment.
jwt.secret=test-only-jwt-secret-that-is-at-least-32-bytes-long

# Test fixture data initialization
app.seed.admin=true
app.seed.sample-data=true
app.seed.mobile-pins=true


# Import the root-level .env file (using [.properties] to parse it as standard properties key-value format)
spring.config.import=optional:file:../.env[.properties]

# Bind datasource configuration to env values loaded from the .env file, with local fallbacks
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:tnl_dev}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

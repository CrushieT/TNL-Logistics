name: OWASP Dependency Check

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'backend/.mvn/**'
      - 'backend/Dockerfile'
      - '.github/workflows/owasp-check.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'backend/.mvn/**'
      - 'backend/Dockerfile'
      - '.github/workflows/owasp-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  security-scan:
    name: Backend Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          cd backend
          if [ -n "$NVD_API_KEY" ]; then
            mvn org.owasp:dependency-check-maven:check "-DnvdApiKey=$NVD_API_KEY"
          else
            echo "NVD_API_KEY secret not found; running without API key..."
            mvn org.owasp:dependency-check-maven:check
          fi

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
